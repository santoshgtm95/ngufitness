<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FITLAB Fitness - Starting...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      user-select: none;
      -webkit-app-region: drag;
    }

    .logo-wrap {
      margin-bottom: 2rem;
    }

    .logo-icon {
      font-size: 5rem;
      display: block;
      text-align: center;
      animation: pulse 2s ease-in-out infinite;
    }

    .app-name {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-align: center;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: 0.5rem;
    }

    .tagline {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 2px;
      text-align: center;
      margin-top: 0.25rem;
      text-transform: uppercase;
    }

    .spinner-wrap {
      margin-top: 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .status {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 1px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }
    }
  </style>
</head>

<body>
  <div class="logo-wrap">
    <span class="logo-icon">🏋️</span>
    <div class="app-name">FITLAB FITNESS</div>
    <div class="tagline">Membership Management</div>
  </div>
  <div class="spinner-wrap">
    <div class="spinner"></div>
    <div class="status">Starting application...</div>
  </div>
</body>

</html>
