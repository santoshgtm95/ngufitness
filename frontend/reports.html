<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - NGU Fitness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/reports.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Left Sidebar - Navigation -->
        <aside class="nav-sidebar">
            <!-- Sidebar content will be injected by sidebar.js -->
        </aside>

        <!-- Main Content -->
        <main class="main-content reports-main">
            <!-- Header Controls Wrapper -->
            <div class="reports-controls-wrapper">
                <!-- Period Selector -->
                <div class="period-selector">
                    <button class="period-btn" data-period="daily">
                        <span class="period-icon">📅</span>
                        <span>Daily</span>
                    </button>
                    <button class="period-btn active" data-period="monthly">
                        <span class="period-icon">📆</span>
                        <span>Monthly</span>
                    </button>
                    <button class="period-btn" data-period="yearly">
                        <span class="period-icon">🗓️</span>
                        <span>Yearly</span>
                    </button>
                </div>

                <!-- Filter Controls (Year and Month) -->
                <div class="filter-controls" id="filterControls">
                    <div class="filter-group">
                        <label for="yearSelect">Year</label>
                        <select id="yearSelect" class="filter-select">
                            <!-- Options will be populated by reports.js -->
                        </select>
                    </div>
                    <div class="filter-group" id="monthFilterGroup">
                        <label for="monthSelect">Month</label>
                        <select id="monthSelect" class="filter-select">
                            <option value="1">January</option>
                            <option value="2">February</option>
                            <option value="3">March</option>
                            <option value="4">April</option>
                            <option value="5">May</option>
                            <option value="6">June</option>
                            <option value="7">July</option>
                            <option value="8">August</option>
                            <option value="9">September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>
                        </select>
                    </div>
                    <div class="filter-group" id="dayFilterGroup" style="display: none;">
                        <label for="daySelect">Day</label>
                        <select id="daySelect" class="filter-select">
                            <option value="">All Days</option>
                            <!-- Options will be populated by reports.js -->
                        </select>
                    </div>
                </div>
            </div>

            <!-- Statistics Cards -->
            <div class="stats-grid single-stat">
                <div class="stat-card">
                    <div class="stat-icon" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                        💰
                    </div>
                    <div class="stat-content">
                        <h3 id="totalRevenue">0฿</h3>
                        <p>Total Revenue</p>
                    </div>
                </div>
            </div>

            <!-- Detailed Report Section -->
            <div class="details-section">
                <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                    <div>
                        <h3>Detailed Report</h3>
                        <p class="section-subtitle">Individual transactions for the selected period</p>
                    </div>
                    <button id="downloadPdfBtn" class="download-btn">
                        <span style="font-size: 1.1rem;">📄</span> Download PDF
                    </button>
                </div>
                <div class="table-container">
                    <table class="details-table" id="detailsTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Customer</th>
                                <th>Type</th>
                                <th>Item / Package</th>
                                <th>Amount</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="detailsBody">
                            <!-- Data will be populated by reports.js -->
                        </tbody>
                    </table>
                </div>
            </div>




            <!-- Charts Grid -->
            <div class="charts-grid">
                <div class="chart-card">
                    <div class="chart-header">
                        <h3 id="revenueChartTitle">Payment Income</h3>
                        <p class="chart-subtitle">Analyze revenue trends and patterns</p>
                    </div>
                    <div class="chart-container">
                        <canvas id="revenueChart"></canvas>
                    </div>
                </div>
            </div>
            <!-- Loading Overlay -->
            <div id="loadingOverlay" class="loading-overlay">
                <div class="loading-spinner"></div>
                <p>Loading reports...</p>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/sidebar.js"></script>
</body>

</html>
