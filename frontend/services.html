<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services - FITLAB Fitness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=2.0">
</head>

<body>
  <div class="app-container">
    <!-- Left Sidebar - Navigation -->
    <aside class="nav-sidebar">
      <!-- Sidebar content will be injected by sidebar.js -->
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Header -->
      <header class="header">
        <div class="header-content">
          <button class="hamburger-menu" id="hamburgerMenu" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <img src="assets/logo.png" alt="FITLAB Fitness Logo" class="header-logo">
          <div>
            <h1>Services</h1>
            <p>Manage additional fitness center services</p>
          </div>
        </div>
      </header>

      <!-- Action Bar -->
      <div class="action-bar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Search by service name or customer...">
        </div>
        <div class="action-buttons">
          <button class="btn btn-primary" onclick="servicesApp.showAddServiceModal()">
            <span>➕</span> Add Service
          </button>
        </div>
      </div>

      <!-- Services Table -->
      <div class="table-container">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Service Name</th>
                <th>Customer</th>
                <th>Price</th>
                <th>Service Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="servicesTableBody">
              <!-- Service rows will be dynamically inserted here -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Mobile Overlay -->
    <div class="mobile-overlay" id="mobileOverlay"></div>
  </div>

  <!-- Add/Edit Service Modal -->
  <div id="serviceModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="serviceModalTitle">Add Service</h2>
        <button class="modal-close" onclick="servicesApp.closeServiceModal()">✕</button>
      </div>
      <form id="serviceForm">
        <input type="hidden" id="serviceId">
        <div class="form-group">
          <label for="serviceName">Service Name *</label>
          <input type="text" id="serviceName" required placeholder="Enter service name">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="servicePaymentStatus">Payment Status *</label>
            <select id="servicePaymentStatus" required>
              <option value="paid">Paid</option>
              <option value="unpaid">Unpaid</option>
              <option value="partially_paid">Partially Paid</option>
            </select>
          </div>
          <div class="form-group">
            <label for="servicePrice">Price *</label>
            <input type="number" id="servicePrice" required placeholder="0.00" min="0" step="0.01">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="serviceDate">Service Date *</label>
            <input type="date" id="serviceDate" required>
          </div>
        </div>
        <div class="form-group">
          <label for="serviceCustomer">Customer (Optional)</label>
          <select id="serviceCustomer">
            <option value="">-- No customer --</option>
            <!-- Customer options will be dynamically inserted here -->
          </select>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="servicesApp.closeServiceModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Service</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/services.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/sync.js"></script>
</body>

</html>
